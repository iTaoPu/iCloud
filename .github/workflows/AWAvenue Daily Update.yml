name: AWAvenue Daily Update

# 触发条件：每3天自动运行 + 手动触发
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

# 显式赋予写入权限
permissions:
  contents: write

jobs:
  sync-black-filter:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出仓库
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: Grey
          persist-credentials: true

      # 2. 设置Python环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. 下载远程AWAvenue规则
      - name: Download remote AWAvenue filter file
        id: download
        run: |
          echo "📥 下载AWAvenue-Ads-Rule.txt..."
          # 使用可靠的下载地址
          URLS=(
            "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/AWAvenue-Ads-Rule.txt"
          )
          
          for url in "${URLS[@]}"; do
            echo "尝试: $url"
            if curl -sL --retry 3 --connect-timeout 30 -o "temp_black_filter.txt" "$url"; then
              RULE_COUNT=$(wc -l < "temp_black_filter.txt" | tr -d ' ')
              if [ "$RULE_COUNT" -gt 100 ]; then
                echo "✅ 下载成功，共 $RULE_COUNT 行"
                echo "DOWNLOAD_SUCCESS=1" >> $GITHUB_OUTPUT
                exit 0
              fi
            fi
            sleep 2
          done
          
          echo "❌ 所有下载尝试失败"
          exit 1

      # 4. 执行Python脚本（需要放在正确位置）
      - name: Run black filter sync script
        id: sync
        if: steps.download.outputs.DOWNLOAD_SUCCESS == '1'
        run: |
          echo "🚀 执行Python脚本..."
          python .github/workflows/update_black_filter.py
          
          # 提取版本号
          if [ -f "black_script_output.log" ]; then
            NEW_VERSION=$(grep "^NEW_VERSION=" black_script_output.log | cut -d'=' -f2 || echo "1.0.0.0")
            echo "版本号: $NEW_VERSION"
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          else
            echo "❌ 日志文件不存在"
            exit 1
          fi
          
          # 验证生成的文件
          if [ -f "black.txt" ]; then
            BLACK_RULE_COUNT=$(wc -l < "black.txt")
            echo "生成的black.txt包含 $BLACK_RULE_COUNT 行"
          else
            echo "❌ black.txt未生成"
            exit 1
          fi

      # 5. 提交并推送
      - name: Commit and push changes
        if: steps.download.outputs.DOWNLOAD_SUCCESS == '1' && steps.sync.outputs.new_version
        env:
          NEW_VERSION: ${{ steps.sync.outputs.new_version }}
        run: |
          # 配置Git身份
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 切换到正确分支
          git checkout Grey || git checkout -b Grey
          
          # 添加文件
          git add black.txt
          
          # 检查是否有变更
          if git diff --cached --quiet; then
            echo "ℹ️ 无变更，跳过提交"
            exit 0
          fi
          
          # 提交
          git commit -m "🔄 Auto update black.txt to v${NEW_VERSION}"
          
          # 推送（使用token认证）
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git Grey
          
          echo "✅ 更新完成并已推送"

      # 6. 清理临时文件
      - name: Cleanup
        if: always()
        run: |
          rm -f temp_black_filter.txt black_script_output.log .black_*.log || true
          echo "🧹 清理完成"
