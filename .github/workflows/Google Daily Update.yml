name: Google Daily Update

# 触发条件：每6小时自动运行 + 手动触发（和GKD一致）
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

# 复用GKD的权限声明（核心：显式赋予写入权限）
permissions:
  contents: write
  pull-requests: write

jobs:
  sync-google-filter:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出仓库（复用GKD逻辑，指定Grey分支）
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: Grey
          persist-credentials: true

      # 2. 设置Python环境（和GKD完全一致）
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. 安装依赖（和GKD保持一致）
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install json5 requests

      # 4. 下载远程filter_37.txt（带代理+重试）
      - name: Download remote filter file
        run: |
          echo "📥 下载filter_37.txt到仓库根目录..."
          # 带重试+代理，确保下载成功
          curl -sL --retry 10 --connect-timeout 30 \
            "https://adguardteam.github.io/HostlistsRegistry/assets/filter_37.txt" \
            -o "temp_filter.txt"
          
          # 验证文件（失败则创建空文件不终止）
          if [ -s "temp_filter.txt" ]; then
            echo "✅ 下载成功，文件大小：$(du -h temp_filter.txt | awk '{print $1}')"
            touch .filter_download_success  # 创建下载成功标记文件
          else
            echo "⚠️ 下载失败，创建空文件继续流程"
            touch temp_filter.txt
          fi

      # 5. 执行Python脚本（指定.github/workflows下的脚本）
      - name: Run Google filter sync script
        id: sync
        if: hashFiles('.filter_download_success') != ''
        run: |
          echo "🚀 执行.github/workflows/update_google_filter.py..."
          # 执行脚本（根目录运行，脚本路径绝对指定）
          python .github/workflows/update_google_filter.py
          
          # 提取版本号（复用GKD的标记文件逻辑）
          NEW_VERSION=$(grep "^NEW_VERSION=" script_output.log | cut -d'=' -f2 || echo "1.0.0.0")
          echo "$NEW_VERSION" > .google_update_success
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

      # 6. 提交并推送（修复rebase冲突问题）
      - name: Commit and push changes to Grey branch
        if: hashFiles('.google_update_success') != ''
        run: |
          # 配置Git身份（和GKD完全一致）
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 切换到Grey分支
          git checkout Grey
          
          # 核心修复：暂存本地修改→拉取最新→恢复修改（解决rebase冲突）
          git stash push -u -m "temp stash for google.txt update"
          git pull origin Grey --rebase || echo "远程Grey分支无更新，跳过rebase"
          git stash pop || (echo "⚠️ 暂存恢复失败，直接添加文件" && git add Google.txt)
          
          # 读取版本号（复用GKD的文件读取）
          NEW_VERSION=$(cat .google_update_success)
          
          # 添加生成的Google.txt
          git add Google.txt || true
          
          # 检查变更（GKD的关键防错逻辑）
          if git diff --staged --quiet; then
            echo "ℹ️  无变更，跳过推送"
            exit 0
          fi
          
          # 提交（GKD风格的提交信息）
          git commit -m "🔄 自动更新Google过滤规则至版本 v${NEW_VERSION}" --allow-empty
          
          # 推送（原生git push，和GKD一致）
          git push origin Grey
          echo "🚀 Google.txt已推送到Grey分支！"

      # 7. 清理临时文件（复用GKD的清理逻辑）
      - name: Cleanup temporary files
        if: always()
        run: |
          rm -f temp_filter.txt .filter_download_success .google_update_success script_output.log || true
          echo "🧹 临时文件清理完成"
