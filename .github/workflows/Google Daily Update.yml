# 工作流名称
name: Google Daily Update

# 触发条件：北京时间定时触发 + 手动触发
on:
  schedule:
    # 北京时间每天凌晨2点触发（UTC时间18:00）
    - cron: '0 18 * * *'
  workflow_dispatch:  # 手动触发开关

jobs:
  fetch-modify-push:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai  # 全局设置北京时间

    steps:
      # 步骤1：拉取仓库代码（兼容Grey分支不存在的情况）
      - name: 拉取仓库代码（Grey分支）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 步骤2：配置Python环境（关闭pip缓存，解决无依赖文件报错）
      - name: 安装并配置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 步骤3：下载远程filter_37.txt文件（增加失败重试）
      - name: 拉取远程Google过滤规则文件
        run: |
          # 静默下载，失败重试3次，超时10秒
          curl -sL --retry 3 --connect-timeout 10 \
            "https://raw.githubusercontent.com/AdguardTeam/HostlistsRegistry/main/assets/filter_37.txt" \
            -o "temp_filter.txt"
          # 验证文件是否有效
          if [ -s "temp_filter.txt" ]; then
            echo "✅ 远程文件下载成功，大小：$(du -h temp_filter.txt | awk '{print $1}')"
          else
            echo "❌ 远程文件下载失败或为空"
            exit 1
          fi

      # 步骤4：运行Python脚本生成Google.txt（关键：提取可靠的环境变量）
      - name: 执行Python脚本生成Google.txt
        id: generate_file  # 给步骤加ID，便于读取输出
        run: |
          # 检查Python脚本是否存在
          if [ ! -f ".github/workflows/update_google_filter.py" ]; then
            echo "❌ Python脚本不存在：.github/workflows/update_google_filter.py"
            exit 1
          fi
          # 执行脚本并捕获输出（只提取NEW_VERSION和CURRENT_DATE）
          SCRIPT_OUTPUT=$(python .github/workflows/update_google_filter.py)
          echo "脚本输出：$SCRIPT_OUTPUT"
          
          # 从脚本输出中提取版本号和时间（可靠方式）
          NEW_VERSION=$(echo "$SCRIPT_OUTPUT" | grep "^NEW_VERSION=" | cut -d'=' -f2)
          CURRENT_DATE=$(echo "$SCRIPT_OUTPUT" | grep "^CURRENT_DATE=" | cut -d'=' -f2)
          
          # 验证提取结果，为空则设默认值
          NEW_VERSION=${NEW_VERSION:-"1.0.0.0"}
          CURRENT_DATE=${CURRENT_DATE:-$(date +"%Y-%m-%d")}
          
          # 设置为步骤输出（替代env文件，更可靠）
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "CURRENT_DATE=$CURRENT_DATE" >> $GITHUB_OUTPUT
          
          # 验证生成结果
          echo "✅ 提取到的信息："
          echo "   版本号：$NEW_VERSION"
          echo "   更新时间：$CURRENT_DATE"
          head -10 Google.txt

      # 步骤5：确保切换到Grey分支
      - name: 切换/创建Grey分支
        run: |
          # 若Grey分支不存在，基于当前分支创建
          git checkout Grey || git checkout -b Grey
          echo "✅ 当前分支：$(git branch --show-current)"

      # 步骤6：提交并推送修改到Grey分支
      - name: 提交并推送修改到Grey分支
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 检查Google.txt是否有修改
          if git status --porcelain | grep -q "Google.txt"; then
            git add Google.txt
            # 使用步骤输出的变量（更可靠）
            COMMIT_MSG="chore: 更新Google.txt 版本号${{ steps.generate_file.outputs.NEW_VERSION }} 北京时间${{ steps.generate_file.outputs.CURRENT_DATE }}"
            git commit -m "$COMMIT_MSG"
            # 推送至Grey分支
            git push -u origin Grey
            echo "✅ 成功推送到Grey分支，提交信息：$COMMIT_MSG"
          else
            echo "ℹ️ Google.txt无修改，无需推送"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 步骤7：清理临时文件
      - name: 清理临时文件
        if: always()
        run: |
          rm -f temp_filter.txt
          echo "✅ 临时文件清理完成"

      # 步骤8：输出运行日志
      - name: 输出运行总结
        if: always()
        run: |
          echo "📝 运行总结："
          echo "   分支：$(git branch --show-current)"
          echo "   版本：${{ steps.generate_file.outputs.NEW_VERSION }}"
          echo "   时间：${{ steps.generate_file.outputs.CURRENT_DATE }}"
          echo "   状态：${{ job.status }}"
