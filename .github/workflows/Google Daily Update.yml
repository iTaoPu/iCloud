name: Google Daily Update

# 触发条件：每3天UTC 10:00运行（北京时间18:00）
on:
  schedule:
    - cron: '0 18 */3 * *'  # UTC 10:00 = 北京时间18:00
  workflow_dispatch:

# 显式赋予写入权限
permissions:
  contents: write

jobs:
  sync-google-filter:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出仓库
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: Grey
          persist-credentials: true

      # 2. 设置Python环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. 下载Google规则（FIXED：输出正确的文件名）
      - name: Download remote Google filter file
        id: download_google
        run: |
          echo "📥 下载Google过滤规则..."
          
          # URL列表
          URLS=(
            "https://raw.githubusercontent.com/AdguardTeam/HostlistsRegistry/main/assets/filter_37.txt"
          )
          
          for url in "${URLS[@]}"; do
            echo "尝试下载: $url"
            # 关键修复：输出文件名必须与Python脚本匹配
            if curl -sL --retry 2 --connect-timeout 30 -o "temp_filter.txt" "$url"; then
              # 验证文件内容
              RULE_COUNT=$(grep -c '^' "temp_filter.txt" 2>/dev/null || wc -l < "temp_filter.txt" || echo "0")
              if [ "$RULE_COUNT" -gt 50 ]; then
                echo "✅ 下载成功，共 $RULE_COUNT 行规则"
                echo "DOWNLOAD_SUCCESS=1" >> $GITHUB_OUTPUT
                exit 0  # 成功即退出
              else
                echo "⚠️ 规则数量过少: $RULE_COUNT"
              fi
            fi
            sleep 1  # 失败后等待1秒再试下一个
          done
          
          echo "❌ 所有下载尝试失败"
          exit 1

      # 4. 执行Python脚本（增加调试信息）
      - name: Run Google filter sync script
        id: sync_google
        if: steps.download_google.outputs.DOWNLOAD_SUCCESS == '1'
        run: |
          echo "🚀 处理Google过滤规则..."
          echo "当前工作目录：$(pwd)"
          echo "目录内容："
          ls -la
          
          # 检查临时文件
          echo "检查临时文件："
          ls -la temp_filter.txt 2>/dev/null || echo "临时文件不存在"
          
          # 检查Python脚本
          SCRIPT=".github/workflows/update_google_filter.py"
          if [ -f "$SCRIPT" ]; then
            echo "✅ 找到Python脚本: $SCRIPT"
            echo "脚本大小: $(wc -c < "$SCRIPT") 字节"
          else
            echo "❌ 未找到Python脚本: $SCRIPT"
            find . -name "*.py" -type f 2>/dev/null | head -10
            exit 1
          fi
          
          # 执行脚本（使用绝对路径）
          python "$SCRIPT"
          
          # 检查执行结果
          if [ $? -eq 0 ]; then
            echo "✅ Python脚本执行成功"
          else
            echo "❌ Python脚本执行失败"
            # 查看日志文件
            if [ -f "script_output.log" ]; then
              echo "=== 脚本输出日志 ==="
              tail -50 script_output.log
              echo "==================="
            fi
            exit 1
          fi
          
          # 输出结果信息
          if [ -f "script_output.log" ]; then
            echo "=== 最新日志内容 ==="
            tail -20 script_output.log
            echo "================="
            
            # 提取版本号
            if grep -q "^NEW_VERSION=" script_output.log; then
              NEW_VERSION=$(grep "^NEW_VERSION=" script_output.log | cut -d'=' -f2)
              echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            else
              NEW_VERSION="google_$(date +%Y.%m.%d.%H)"
              echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            fi
          else
            NEW_VERSION="google_$(date +%Y.%m.%d.%H)"
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          fi
          
          # 验证生成的文件
          if [ -f "Google.txt" ]; then
            GOOGLE_RULE_COUNT=$(grep -c '^' "Google.txt" 2>/dev/null || echo "1")
            echo "✅ 生成Google.txt: $GOOGLE_RULE_COUNT 条规则"
            echo "file_ready=1" >> $GITHUB_OUTPUT
          else
            echo "❌ Google.txt未生成"
            exit 1
          fi

      # 5. 提交并推送
      - name: Commit and push Google updates
        if: steps.download_google.outputs.DOWNLOAD_SUCCESS == '1' && steps.sync_google.outputs.file_ready == '1'
        env:
          NEW_VERSION: ${{ steps.sync_google.outputs.new_version }}
        run: |
          echo "🚀 提交Google规则更新..."
          
          # 配置Git身份
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 确保在Grey分支
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          if [ "$CURRENT_BRANCH" != "Grey" ]; then
            echo "当前分支: $CURRENT_BRANCH，切换到Grey分支"
            git checkout Grey 2>/dev/null || git checkout -b Grey
          else
            echo "已在Grey分支上"
          fi
          
          # 添加文件
          git add Google.txt
          
          # 检查变更
          if git diff --cached --quiet; then
            echo "ℹ️ 无内容变更，跳过提交"
            exit 0
          fi
          
          # 生成提交信息
          if [ -n "${{ env.NEW_VERSION }}" ]; then
            COMMIT_VERSION="${{ env.NEW_VERSION }}"
          else
            COMMIT_VERSION="$(date +%Y.%m.%d.%H)"
          fi
          
          # 提交并推送
          git commit -m "🔄 [Google] Auto update to v${COMMIT_VERSION}"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git Grey
          
          echo "✅ Google规则更新完成并已推送"

      # 6. 清理临时文件
      - name: Cleanup
        if: always()
        run: |
          echo "🧹 清理临时文件..."
          rm -f temp_filter.txt script_output.log 2>/dev/null || true
          echo "清理完成"
