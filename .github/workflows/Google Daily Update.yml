# 工作流名称
name: Google Daily Update

# 触发条件：北京时间定时触发 + 手动触发
on:
  schedule:
    # 北京时间每天凌晨2点触发（UTC时间18:00）
    - cron: '0 18 * * *'
  workflow_dispatch:  # 手动触发开关

jobs:
  fetch-modify-push:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai  # 全局设置北京时间

    steps:
      # 步骤1：拉取仓库代码（兼容Grey分支不存在的情况）
      - name: 拉取仓库代码（Grey分支）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 先尝试拉取Grey分支，不存在则拉取默认分支（main/master）
          ref: ${{ github.event.inputs.branch || 'Grey' }}

      # 步骤2：配置Python环境（关闭pip缓存，解决无依赖文件报错）
      - name: 安装并配置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          # 移除cache配置，避免查找requirements.txt/pyproject.toml
          # cache: "pip"  # 注释掉这行，解决"无匹配文件"报错

      # 步骤3：下载远程filter_37.txt文件（增加失败重试）
      - name: 拉取远程Google过滤规则文件
        run: |
          # 静默下载，失败重试3次，超时10秒
          curl -sL --retry 3 --connect-timeout 10 \
            "https://raw.githubusercontent.com/AdguardTeam/HostlistsRegistry/main/assets/filter_37.txt" \
            -o "temp_filter.txt"
          # 验证文件是否有效
          if [ -s "temp_filter.txt" ]; then
            echo "✅ 远程文件下载成功，大小：$(du -h temp_filter.txt | awk '{print $1}')"
          else
            echo "❌ 远程文件下载失败或为空"
            exit 1
          fi

      # 步骤4：运行Python脚本生成Google.txt
      - name: 执行Python脚本生成Google.txt
        run: |
          # 检查Python脚本是否存在
          if [ ! -f ".github/workflows/update_google_filter.py" ]; then
            echo "❌ Python脚本不存在：.github/workflows/update_google_filter.py"
            exit 1
          fi
          # 执行脚本
          python .github/workflows/update_google_filter.py
          # 提取版本号和时间
          NEW_VERSION=$(grep -E '^! Version: ' Google.txt | sed 's/! Version: //g')
          CURRENT_DATE=$(grep -E '^! Update Date \(Beijing Time\): ' Google.txt | sed 's/! Update Date (Beijing Time):  //g')
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "CURRENT_DATE=$CURRENT_DATE" >> $GITHUB_ENV
          # 验证生成结果
          head -10 Google.txt

      # 步骤5：确保切换到Grey分支（关键：解决分支不存在问题）
      - name: 切换/创建Grey分支
        run: |
          # 若Grey分支不存在，基于当前分支创建
          git checkout Grey || git checkout -b Grey
          echo "✅ 当前分支：$(git branch --show-current)"

      # 步骤6：提交并推送修改到Grey分支
      - name: 提交并推送修改到Grey分支
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if git status --porcelain | grep -q "Google.txt"; then
            git add Google.txt
            git commit -m "chore: 更新Google.txt 版本号${{ env.NEW_VERSION }} 北京时间${{ env.CURRENT_DATE }}"
            # 推送（首次推送自动关联远程Grey分支）
            git push -u origin Grey
            echo "✅ 成功推送到Grey分支"
          else
            echo "ℹ️ Google.txt无修改，无需推送"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 步骤7：清理临时文件
      - name: 清理临时文件
        if: always()
        run: |
          rm -f temp_filter.txt
          echo "✅ 临时文件清理完成"

      # 步骤8：输出运行日志
      - name: 输出运行总结
        if: always()
        run: |
          echo "📝 运行总结："
          echo "   分支：$(git branch --show-current)"
          echo "   版本：${{ env.NEW_VERSION || '未生成' }}"
          echo "   时间：${{ env.CURRENT_DATE || '未更新' }}"
          echo "   状态：${{ job.status }}"
