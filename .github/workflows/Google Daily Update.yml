name: 拉取并修改Google过滤规则生成Google.txt
on:
  schedule:
    - cron: '0 18 * * *'  # 北京时间2点
  workflow_dispatch:

jobs:
  fetch-modify-push:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      # 步骤1：拉取仓库（不指定分支，确保是合法Git仓库）
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true  # 关键：保留凭证

      # 步骤2：配置Python
      - name: 配置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 步骤3：下载远程文件
      - name: 下载filter_37.txt
        run: |
          curl -sL --retry 3 "https://raw.githubusercontent.com/AdguardTeam/HostlistsRegistry/main/assets/filter_37.txt" -o "temp_filter.txt"
          if [ ! -s "temp_filter.txt" ]; then exit 1; fi

      # 步骤4：运行Python脚本
      - name: 生成Google.txt
        id: gen
        run: |
          python .github/workflows/update_google_filter.py > script.log 2>&1
          NEW_VERSION=$(grep "^NEW_VERSION=" script.log | cut -d'=' -f2 || echo "1.0.0.0")
          CURRENT_DATE=$(grep "^CURRENT_DATE=" script.log | cut -d'=' -f2 || echo "$(date +%Y-%m-%d)")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "CURRENT_DATE=$CURRENT_DATE" >> $GITHUB_OUTPUT

      # 步骤5：终极推送逻辑（核心修复）
      - name: 强制创建Grey分支并推送
        run: |
          # 1. 重置Git配置（确保环境干净）
          git config --global --unset-all user.name
          git config --global --unset-all user.email
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 2. 强制切换到Grey分支（不存在则基于当前分支创建）
          git checkout -B Grey  # -B 强制创建/覆盖本地Grey分支
          
          # 3. 强制设置远程地址（用token认证，核心！）
          git remote set-url origin https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          # 4. 提交文件（无论是否有修改，强制提交）
          git add Google.txt || echo "文件未找到，跳过add"
          git commit -m "chore: 更新Google.txt 版本号${{ steps.gen.outputs.NEW_VERSION }} 北京时间${{ steps.gen.outputs.CURRENT_DATE }}" --allow-empty || echo "无修改，跳过commit"
          
          # 5. 强制推送（-f 确保覆盖，仅首次/无冲突时安全）
          git push -f origin Grey
          echo "✅ 强制推送到Grey分支成功"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 步骤6：清理文件
      - name: 清理
        if: always()
        run: rm -f temp_filter.txt script.log
