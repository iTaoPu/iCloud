name: 拉取并修改Google过滤规则生成Google.txt
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch-modify-push:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: Grey
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 修复1：下载文件到根目录，并打印路径+大小（验证下载成功）
      - name: Download remote filter file
        run: |
          echo "📥 当前工作目录：$(pwd)"
          # 下载到仓库根目录（绝对路径确保无误）
          ROOT_DIR=$(pwd)
          TEMP_FILE="$ROOT_DIR/temp_filter.txt"
          
          # 带详细日志的下载命令
          curl -v --retry 10 --connect-timeout 30 \
            "https://raw.githubusercontent.com/AdguardTeam/HostlistsRegistry/main/assets/filter_37.txt" \
            -o "$TEMP_FILE"
          
          # 强制验证文件（打印关键信息）
          echo "📄 下载文件验证："
          echo "路径：$TEMP_FILE"
          echo "是否存在：$(if [ -f "$TEMP_FILE" ]; then echo "是"; else echo "否"; fi)"
          echo "文件大小：$(du -h "$TEMP_FILE" | awk '{print $1}')"
          echo "前5行内容："
          head -5 "$TEMP_FILE" || echo "文件为空"

      # 修复2：执行Python脚本时，明确指定根目录，避免路径错误
      - name: Run Python script to generate Google.txt
        id: gen
        run: |
          echo "🚀 当前工作目录：$(pwd)"
          SCRIPT_PATH=".github/workflows/update_google_filter.py"
          TEMP_FILE="$(pwd)/temp_filter.txt"
          
          # 传递根目录和临时文件路径给Python脚本（关键！）
          export ROOT_DIR=$(pwd)
          export TEMP_FILTER_PATH="$TEMP_FILE"
          
          # 检查脚本和临时文件是否存在
          if [ ! -f "$SCRIPT_PATH" ]; then
            echo "❌ Python脚本不存在：$SCRIPT_PATH"
            exit 1
          fi
          if [ ! -f "$TEMP_FILE" ]; then
            echo "❌ 临时文件不存在：$TEMP_FILE"
            exit 1
          fi
          
          # 执行脚本（在根目录执行，确保路径正确）
          python "$SCRIPT_PATH" > script.log 2>&1
          if [ $? -ne 0 ]; then
            echo "❌ 脚本执行失败，日志："
            cat script.log
            exit 1
          fi
          
          # 提取输出并验证生成的Google.txt
          NEW_VERSION=$(grep "^NEW_VERSION=" script.log | cut -d'=' -f2)
          CURRENT_DATE=$(grep "^CURRENT_DATE=" script.log | cut -d'=' -f2)
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "CURRENT_DATE=$CURRENT_DATE" >> $GITHUB_OUTPUT
          
          echo "✅ Google.txt生成验证："
          echo "路径：$(pwd)/Google.txt"
          echo "是否存在：$(if [ -f "Google.txt" ]; then echo "是"; else echo "否"; fi)"
          head -10 Google.txt || echo "文件为空"
          echo "$NEW_VERSION" > .google_update_success

      # 保留后续的提交/推送/清理步骤（无需修改）
      - name: Commit and push changes to Grey branch
        if: hashFiles('.google_update_success') != ''
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout Grey
          git pull origin Grey --rebase
          
          NEW_VERSION=$(cat .google_update_success)
          git add Google.txt || true
          
          if git diff --staged --quiet; then
            echo "ℹ️  没有需要提交的变更"
            exit 0
          fi
          
          git commit -m "🔄 自动更新Google.txt至版本 v${NEW_VERSION}（北京时间${{ steps.gen.outputs.CURRENT_DATE }}）" --allow-empty
          git push origin Grey
          echo "🚀 Google.txt更新已成功推送到Grey分支！"

      - name: Cleanup temporary files
        if: always()
        run: |
          rm -f temp_filter.txt script.log .google_update_success || true
          echo "🧹 临时文件清理完成"
