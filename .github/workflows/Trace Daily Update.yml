name: Trace Daily Update

on:
  schedule:
    - cron: '0 10 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-Trace-filter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: Grey
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Download remote Trace filter file
        id: download
        run: |
          echo "📥 下载 AdGuard Tracking Protection 规则..."
          URLS=(
            "https://filters.adtidy.org/android/filters/3_optimized.txt"
          )
          
          for url in "${URLS[@]}"; do
            echo "尝试: $url"
            if curl -sL --retry 3 --connect-timeout 30 -o "temp_Trace_filter.txt" "$url"; then
              RULE_COUNT=$(wc -l < "temp_Trace_filter.txt" | tr -d ' ')
              if [ "$RULE_COUNT" -gt 100 ]; then
                echo "✅ 下载成功，共 $RULE_COUNT 行"
                echo "DOWNLOAD_SUCCESS=1" >> $GITHUB_OUTPUT
                exit 0
              fi
            fi
            sleep 2
          done
          
          echo "❌ 所有下载尝试失败"
          exit 1

      - name: Run Trace filter sync script
        id: sync
        if: steps.download.outputs.DOWNLOAD_SUCCESS == '1'
        run: |
          echo "🚀 执行Python脚本..."
          python .github/workflows/update_Trace_filter.py || {
            echo "❌ Python 执行报错，打印日志内容："
            [ -f "Trace_script_output.log" ] && cat Trace_script_output.log
            exit 1
          }
          
          if [ -f "Trace_script_output.log" ]; then
            cat Trace_script_output.log
            NEW_VERSION=$(grep "^NEW_VERSION=" Trace_script_output.log | cut -d'=' -f2 || echo "1.0.0.0")
            echo "版本号: $NEW_VERSION"
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          else
            echo "❌ 日志文件不存在"
            exit 1
          fi
          
          if [ -f "Trace.txt" ]; then
            Trace_RULE_COUNT=$(wc -l < "Trace.txt")
            echo "生成的Trace.txt包含 $Trace_RULE_COUNT 行"
          else
            echo "❌ Trace.txt未生成"
            exit 1
          fi

      - name: Commit and push changes
        if: steps.download.outputs.DOWNLOAD_SUCCESS == '1' && steps.sync.outputs.new_version
        env:
          NEW_VERSION: ${{ steps.sync.outputs.new_version }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout Grey || git checkout -b Grey
          
          git add Trace.txt
          
          if git diff --cached --quiet; then
            echo "ℹ️ 无变更，跳过提交"
            exit 0
          fi
          
          git commit -m "🔄 Auto update Trace.txt to v${NEW_VERSION}"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git Grey
          
          echo "✅ 更新完成并已推送"

      - name: Cleanup
        if: always()
        run: |
          rm -f temp_Trace_filter.txt Trace_script_output.log || true
          echo "🧹 清理完成"
