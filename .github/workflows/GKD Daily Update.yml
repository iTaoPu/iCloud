name: GKD Subscription Sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      # 步骤1: 检出仓库
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # 步骤2: 设置Python环境
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 步骤3: 安装Python依赖
      - name: Install dependencies
        run: pip install json5 requests

      # 步骤4: 创建获取上游版本的Python脚本
      - name: Get upstream version
        id: get_upstream
        run: |
          cat > get_version.py << 'EOF'
import json5
import requests
import os
import sys

print("Starting upstream version check...")

try:
    # 下载版本文件（JSON5格式）
    version_url = "https://raw.githubusercontent.com/Lin-arm/GKD_subscription/main/dist/gkd.version.json5"
    print(f"Downloading from: {version_url}")
    
    response = requests.get(version_url, timeout=10)
    response.raise_for_status()
    
    print(f"Raw content: {response.text}")
    
    # 解析JSON5（可以处理无引号的key）
    data = json5.loads(response.text)
    
    upstream_version = int(data.get("version", 0))
    upstream_id = int(data.get("id", 667))
    
    print(f"Parsed version: {upstream_version}")
    print(f"Parsed id: {upstream_id}")
    
    # 输出到GitHub Actions环境
    with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
        fh.write(f"upstream_version={upstream_version}\n")
        fh.write(f"upstream_id={upstream_id}\n")
    
    print("Successfully got upstream version")
    
except Exception as e:
    print(f"Error getting upstream version: {e}")
    import traceback
    traceback.print_exc()
    sys.exit(1)
EOF

          python get_version.py

      # 步骤5: 检查本地版本
      - name: Check local version
        id: check_local
        run: |
          echo "Checking local version file..."
          
          if [ -f "Guīzé.version.stor" ]; then
            echo "Local version file found"
            LOCAL_VERSION=$(python3 -c "
import json
try:
    with open('Guīzé.version.stor', 'r', encoding='utf-8') as f:
        data = json.load(f)
    print(data.get('version', 0))
except Exception as e:
    print('0')
")
          else
            echo "Local version file not found"
            LOCAL_VERSION="0"
          fi
          
          echo "Local version: $LOCAL_VERSION"
          echo "local_version=$LOCAL_VERSION" >> $GITHUB_OUTPUT

      # 步骤6: 比较版本
      - name: Compare versions
        id: compare
        run: |
          LOCAL_VERSION="${{ steps.check_local.outputs.local_version }}"
          UPSTREAM_VERSION="${{ steps.get_upstream.outputs.upstream_version }}"
          
          echo "Version comparison:"
          echo "Local: $LOCAL_VERSION"
          echo "Upstream: $UPSTREAM_VERSION"
          
          # 转换为整数
          LOCAL_INT=$((LOCAL_VERSION))
          UPSTREAM_INT=$((UPSTREAM_VERSION))
          
          if [ $UPSTREAM_INT -gt $LOCAL_INT ]; then
            echo "New version available!"
            echo "need_update=true" >> $GITHUB_OUTPUT
          else
            echo "Already up to date"
            echo "need_update=false" >> $GITHUB_OUTPUT
          fi

      # 步骤7: 下载和处理订阅（仅在需要更新时）
      - name: Download and process subscription
        if: steps.compare.outputs.need_update == 'true'
        env:
          UPSTREAM_VERSION: ${{ steps.get_upstream.outputs.upstream_version }}
        run: |
          echo "Downloading subscription file..."
          
          cat > process_subscription.py << 'EOF'
import json5
import json
import requests
import os

print("Starting subscription processing...")

try:
    # 下载完整订阅文件
    subscription_url = "https://raw.githubusercontent.com/Lin-arm/GKD_subscription/main/dist/gkd.json5"
    print(f"Downloading: {subscription_url}")
    
    response = requests.get(subscription_url, timeout=30)
    response.raise_for_status()
    
    # 解析JSON5
    data = json5.loads(response.text)
    print(f"Original version: {data.get('version')}")
    
    # 获取环境变量中的版本
    upstream_version = int(os.environ.get('UPSTREAM_VERSION', 0))
    
    # 修改数据
    data['id'] = 2015
    data['name'] = '少数π⁺ 🌀Guīzé订阅−禁止传播'
    data['author'] = '少数π⁺'
    data['checkUpdateUrl'] = './Guīzé.version.stor'
    data['supportUri'] = 'https://iCloud.ifanr.us.ci/GKD'
    data['version'] = upstream_version
    
    print(f"Modified ID: {data['id']}")
    print(f"Modified version: {data['version']}")
    
    # 保存为Guīzé.stor（标准JSON格式）
    with open('Guīzé.stor', 'w', encoding='utf-8') as f:
        json.dump(data, f, ensure_ascii=False, indent=2)
    
    print("✅ Guīzé.stor created successfully")
    
    # 创建版本文件（标准JSON格式）
    version_data = {
        "id": 2015,
        "version": upstream_version
    }
    
    with open('Guīzé.version.stor', 'w', encoding='utf-8') as f:
        json.dump(version_data, f, ensure_ascii=False, indent=2)
    
    print("✅ Guīzé.version.stor created successfully")
    
    # 显示文件大小
    main_size = os.path.getsize('Guīzé.stor')
    version_size = os.path.getsize('Guīzé.version.stor')
    print(f"File sizes:")
    print(f"  Guīzé.stor: {main_size:,} bytes")
    print(f"  Guīzé.version.stor: {version_size:,} bytes")
    
except Exception as e:
    print(f"Error processing subscription: {e}")
    import traceback
    traceback.print_exc()
    exit(1)
EOF

          python process_subscription.py

      # 步骤8: 提交更新
      - name: Commit updates
        if: steps.compare.outputs.need_update == 'true'
        env:
          LOCAL_VERSION: ${{ steps.check_local.outputs.local_version }}
          UPSTREAM_VERSION: ${{ steps.get_upstream.outputs.upstream_version }}
        run: |
          echo "Preparing to commit updates..."
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 检查是否有更改
          if git status --porcelain | grep -q "Guīzé"; then
            echo "Changes detected, committing..."
            
            git add "Guīzé.stor" "Guīzé.version.stor"
            
            COMMIT_MSG="✨ Auto-update subscription (v$LOCAL_VERSION → v$UPSTREAM_VERSION)"
            
            git commit -m "$COMMIT_MSG"
            git push
            
            echo "✅ Successfully committed and pushed updates"
          else
            echo "No changes to commit"
          fi
