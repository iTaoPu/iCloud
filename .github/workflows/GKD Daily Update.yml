name: GKD Subscription Sync

# 触发条件：每6小时自动运行 + 手动触发
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# 赋予工作流足够的写入权限
permissions:
  contents: write
  pull-requests: write

jobs:
  sync-subscription:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出仓库代码（指定Grey分支）
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: Grey  # 你的仓库主分支
          # 如需使用PAT，取消注释下面这行
          # token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      # 2. 设置Python环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. 安装依赖包
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install json5 requests

      # 4. 进入GKD目录执行同步脚本
      - name: Run GKD sync script (in GKD directory)
        id: sync
        run: |
          # 确保GKD目录存在
          mkdir -p GKD
          # 进入GKD目录执行脚本
          cd GKD
          python gkd_sync.py

      # 5. 提交并推送GKD目录下的所有更新
      - name: Commit and push changes to Grey branch
        if: hashFiles('GKD/.update_success') != ''
        run: |
          # 配置Git身份
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 【修复1】先拉取最新代码，确保本地分支是最新的
          echo "🔄 拉取远程最新代码..."
          git pull origin Grey
          
          # 【修复2】先暂存和提交所有更改，然后再推送到远程
          echo "📝 暂存GKD目录所有更改..."
          git add GKD/ || true
          
          # 检查是否有实际变更
          if git diff --staged --quiet; then
            echo "ℹ️  没有需要提交的变更"
            exit 0
          fi
          
          # 读取更新版本号
          if [ -f "GKD/.update_success" ]; then
            NEW_VERSION=$(cat "GKD/.update_success")
          else
            echo "❌ 找不到版本标记文件"
            exit 1
          fi
          
          # 提交变更
          echo "💾 提交变更..."
          git commit -m "🔄 自动更新GKD订阅至版本 v${NEW_VERSION}" --allow-empty
          
          # 推送到Grey分支
          echo "🚀 推送更新到远程..."
          git push origin Grey
          
          echo "✅ 更新已成功推送到Grey分支！版本：v${NEW_VERSION}"

      # 6. 清理临时文件（GKD目录内的标记文件）
      - name: Cleanup temporary files
        if: always()
        run: |
          rm -f GKD/.update_success || true
          echo "🧹 临时文件清理完成"
