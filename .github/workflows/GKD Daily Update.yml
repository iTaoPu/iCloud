name: GKD Subscription Sync

# 触发条件：每6小时自动运行 + 手动触发
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync-subscription:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出仓库代码（包含独立的gkd_sync.py文件）
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整提交历史

      # 2. 设置Python环境（移除cache配置，解决报错）
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"  # 移除cache配置

      # 3. 安装依赖包
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install json5 requests

      # 4. 执行独立的同步脚本
      - name: Run GKD sync script
        run: python gkd_sync.py

      # 5. 提交并推送更新（仅当有更新时执行）
      - name: Commit and push changes
        if: hashFiles('.update_success') != ''
        run: |
          # 配置Git身份
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 获取更新后的版本号
          NEW_VERSION=$(cat .update_success)
          
          # 添加更新的文件
          git add Guīzé.stor Guīzé.version.stor
          
          # 提交变更
          git commit -m "🔄 自动更新GKD订阅至版本 v${NEW_VERSION}"
          
          # 推送变更到仓库
          git push
          
          echo "🚀 更新已成功推送到仓库！"

      # 6. 清理临时文件（无论是否更新都执行）
      - name: Cleanup temporary files
        if: always()
        run: |
          rm -f .update_success || true
          echo "🧹 临时文件清理完成"
