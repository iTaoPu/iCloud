name: GKD Sync

on:
  schedule:
    - cron: "0 */6 * * *"  # 每6小时执行一次
  workflow_dispatch:       # 手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install json5 requests

      - name: Sync subscription
        run: |
          cat > sync.py << 'EOF'
import json5
import requests
import json
import os

# 配置信息
UPSTREAM_VERSION_URL = "https://raw.githubusercontent.com/Lin-arm/GKD_subscription/main/dist/gkd.version.json5"
UPSTREAM_SUB_URL = "https://raw.githubusercontent.com/Lin-arm/GKD_subscription/main/dist/gkd.json5"
LOCAL_VERSION_FILE = "Guīzé.version.stor"
LOCAL_SUB_FILE = "Guīzé.stor"

# 自定义配置
CUSTOM_CONFIG = {
    "id": 2015,
    "name": "少数π⁺ 🌀Guīzé訂閱−禁止傳播",
    "author": "少数π⁺",
    "checkUpdateUrl": "./Guīzé.version.stor",
    "supportUri": "https://iCloud.ifanr.us.ci"
}

def get_upstream_version():
    """获取上游版本号"""
    resp = requests.get(UPSTREAM_VERSION_URL, timeout=10)
    data = json5.loads(resp.text)
    return int(data.get("version", 0))

def get_local_version():
    """获取本地版本号"""
    try:
        with open(LOCAL_VERSION_FILE, "r", encoding="utf-8") as f:
            data = json.load(f)
        return int(data.get("version", 0))
    except:
        return 0

def update_subscription(upstream_version):
    """下载并更新订阅文件"""
    # 下载上游订阅
    resp = requests.get(UPSTREAM_SUB_URL, timeout=30)
    data = json5.loads(resp.text)
    
    # 应用自定义配置
    data.update(CUSTOM_CONFIG)
    data["version"] = upstream_version
    
    # 保存主文件
    with open(LOCAL_SUB_FILE, "w", encoding="utf-8") as f:
        json.dump(data, f, ensure_ascii=False, indent=2)
    
    # 保存版本文件
    version_data = {k: v for k, v in data.items() if k in ["id", "name", "version", "author", "checkUpdateUrl", "supportUri"]}
    with open(LOCAL_VERSION_FILE, "w", encoding="utf-8") as f:
        json.dump(version_data, f, ensure_ascii=False, indent=2)
    
    print(f"✅ 已更新到版本 {upstream_version}")

def main():
    print("🔍 检查版本更新...")
    local_ver = get_local_version()
    upstream_ver = get_upstream_version()
    
    print(f"本地版本: {local_ver}, 上游版本: {upstream_ver}")
    
    if upstream_ver > local_ver:
        print("📥 开始更新订阅...")
        update_subscription(upstream_ver)
        # 设置更新标记
        with open("update_flag", "w") as f:
            f.write(f"{local_ver}→{upstream_ver}")
    else:
        print("✅ 已是最新版本")
        exit(0)

if __name__ == "__main__":
    main()
EOF

          # 执行同步脚本
          python sync.py

      - name: Commit and push
        if: hashFiles('update_flag') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 获取版本信息
          VERSION_CHANGE=$(cat update_flag)
          
          # 提交更新
          git add Guīzé.stor Guīzé.version.stor
          git commit -m "🔄 更新订阅 $VERSION_CHANGE"
          git push
          
          # 清理临时文件
          rm -f update_flag
          
          echo "🚀 更新已推送至仓库"
