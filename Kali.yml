# ===================== 基础设置 =====================
mixed-port: 7890
ipv6: true
allow-lan: true
unified-delay: false
tcp-concurrent: true
external-controller: 127.0.0.1:9090
log-level: error
find-process-mode: strict
global-client-fingerprint: chrome

# ===================== 代理提供者 (引入你的 all.yaml) =====================
proxy-providers:
  shaoyouvip:
    type: http
    url: "https://cdn.sspai.pp.ua/raw.githubusercontent.com/shaoyouvip/free/main/all.yaml"
    path: ./proxies/shaoyouvip.yaml
    interval: 3600
    health-check:
      enable: true
      url: https://www.google.com/generate_204
      interval: 300

# ===================== DNS 配置 (还原你的脚本逻辑) =====================
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: true
  use-system-hosts: false
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"
    - "localhost.work.weixin.qq.com"
  default-nameserver:
    - 119.29.29.29
    - 223.5.5.5
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
  nameserver-policy:
    "geosite:cn": ["https://dns.alidns.com/dns-query", "https://doh.pub/dns-query"]
    "geosite:geolocation-!cn": ["https://dns.cloudflare.com/dns-query", "https://dns.google/dns-query"]
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - geolocation-!cn
      - gfw
      - google
      - youtube
      - github
      - telegram
      - cloudflare
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

# ===================== 代理组 (完全还原你的 UI 与逻辑) =====================
proxy-groups:
  - name: 🌐节点选择
    type: select
    proxies: ["♻️延迟选优", "☑️手动切换", "🔯故障转移", "🔮负载均衡", "DIRECT", "🛑全球拦截"]
    icon: "https://cdn.jsdmirror.com/gh/iTaoPu/iCloud@Grey/IconSet/Area.png"

  - name: ☑️手动切换
    type: select
    use: ["shaoyouvip"]
    icon: "https://cdn.jsdmirror.com/gh/iTaoPu/iCloud@Grey/IconSet/Catnet.png"

  - name: ♻️延迟选优
    type: url-test
    use: ["shaoyouvip"]
    interval: 300
    url: "https://www.google.com/generate_204"
    icon: "https://cdn.jsdmirror.com/gh/iTaoPu/iCloud@Grey/IconSet/Auto.png"

  - name: 🔯故障转移
    type: fallback
    use: ["shaoyouvip"]
    interval: 300
    url: "https://www.google.com/generate_204"
    icon: "https://cdn.jsdmirror.com/gh/iTaoPu/iCloud@Grey/IconSet/ambulance.png"

  - name: 🔮负载均衡
    type: load-balance
    use: ["shaoyouvip"]
    strategy: consistent-hashing
    interval: 300
    url: "https://www.google.com/generate_204"
    icon: "https://cdn.jsdmirror.com/gh/iTaoPu/iCloud@Grey/IconSet/balance.png"

  - name: 🎯全球直连
    type: select
    proxies: ["DIRECT", "🔯故障转移", "🔮负载均衡"]
    icon: "https://cdn.jsdmirror.com/gh/iTaoPu/iCloud@Grey/IconSet/link.png"

  - name: 🛑全球拦截
    type: select
    proxies: ["REJECT", "DIRECT"]
    icon: "https://cdn.jsdmirror.com/gh/iTaoPu/iCloud@Grey/IconSet/Reject.png"

  - name: 🐟漏网之鱼
    type: select
    proxies: ["🌐节点选择", "🎯全球直连", "DIRECT", "🔯故障转移", "🔮负载均衡"]
    use: ["shaoyouvip"]
    icon: "https://cdn.jsdmirror.com/gh/iTaoPu/iCloud@Grey/IconSet/fish.png"

